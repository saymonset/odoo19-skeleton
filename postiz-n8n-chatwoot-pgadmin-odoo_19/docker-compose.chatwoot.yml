# docker-compose.chatwoot.yml
services:
  chatwoot-postgres:
    image: pgvector/pgvector:pg12
    container_name: chatwoot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot123
      POSTGRES_DB: chatwoot_production
    volumes:
      - ./v19/chatwoot_pgdata:/var/lib/postgresql/data
    #ports:
      #- "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - odoo_network_19

  chatwoot-app:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-app
    restart: unless-stopped
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RACK_TIMEOUT_SERVICE_TIMEOUT: 60000
      INSTALLATION_ENV: docker
      NODE_ENV: production

      RACK_ATTACK_LIMIT: "10000"
      RACK_ATTACK_ALLOWED_IPS: "127.0.0.1,190.103.28.100"
      RACK_ATTACK_LOGIN_ATTEMPTS_PER_IP: "20"
      RACK_ATTACK_LOGIN_ATTEMPTS_PER_EMAIL: "30"
      RACK_ATTACK_LOGIN_PERIOD_IP: "300"
      RACK_ATTACK_LOGIN_PERIOD_EMAIL: "900"
      
      RAILS_HOST: https://chatwoot.unisasalud.com
      FRONTEND_URL: https://chatwoot.unisasalud.com
      APP_HOST: https://chatwoot.unisasalud.com
      
      ASSET_HOST: https://chatwoot.unisasalud.com
      ACTIVE_STORAGE_HOST: https://chatwoot.unisasalud.com
      RAILS_STORAGE_HOST: https://chatwoot.unisasalud.com
      
      ACTIVE_STORAGE_SERVICE: local
      FILE_ATTACHMENT_ENABLED: "true"
      ENABLE_FILE_PICKER: "true"
      MAXIMUM_FILE_SIZE: "10485760"
      ENABLED_FILE_TYPES: "image/*,audio/*,video/*,text/*,application/pdf"
      
      ACTIVE_STORAGE_ROOT: /app/storage
      RAILS_STORAGE_PATH: /app/storage
      RAILS_ASSET_HOST: https://chatwoot.unisasalud.com
      ACTIVE_STORAGE_URL_HOST: https://chatwoot.unisasalud.com
      ACTIVE_STORAGE_SERVICE_URLS_EXPIRE_IN: "604800"
      
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot123
      POSTGRES_DB: chatwoot_production
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://chatwoot:chatwoot123@chatwoot-postgres:5432/chatwoot_production
      
      REDIS_PASSWORD: redis123
      REDIS_URL: redis://:redis123@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      SECRET_KEY_BASE: 99f4fa1f8fadd2125a12148ccf962c5d1ae16592a7da11ef9fc795f6a5c68e97737746c53ce0ecbc45d64235e349b879312d0a28431c81c2a59165d2d7077c54
      RAILS_MASTER_KEY: 99f4fa1f8fadd2125a12148ccf962c5d1ae16592a7da11ef9fc795f6a5c68e97737746c53ce0ecbc45d64235e349b879312d0a28431c81c2a59165d2d7077c54
      
      FORCE_SSL: "false"
      ALLOW_INSECURE_SSL: "true"
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "true"
      
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOW_CREDENTIALS: "true"
      
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      
      API_AUTH_TOKEN: chatwoot_api_token_1234567890

      # Configuración SMTP (estándar de Chatwoot)
      SMTP_ADDRESS: mail.privateemail.com
      SMTP_PORT: 465
      SMTP_USERNAME: admin@unisasalud.com
      SMTP_PASSWORD: 'Steamashit..17'
      SMTP_DOMAIN: unisasalud.com
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "false"
      SMTP_SSL: "true"
      SMTP_TLS: "true"
      MAILER_SENDER_EMAIL: admin@unisasalud.com
      MAIL_DOMAIN: unisasalud.com

      # Configuración específica de Action Mailer (para forzar SMTP)
      ACTION_MAILER_DELIVERY_METHOD: smtp
      ACTION_MAILER_SMTP_ADDRESS: mail.privateemail.com
      ACTION_MAILER_SMTP_PORT: 465
      ACTION_MAILER_SMTP_USER_NAME: admin@unisasalud.com
      ACTION_MAILER_SMTP_PASSWORD: 'Steamashit..17'
      ACTION_MAILER_SMTP_AUTHENTICATION: plain
      ACTION_MAILER_SMTP_SSL: "true"
      ACTION_MAILER_SMTP_ENABLE_STARTTLS_AUTO: "false"

      # ========== MODIFICACIÓN AGREGADA (siguiendo paso de Portainer) ==========
      # Descomentar o añadir la siguiente línea para conectar con el hub de Chatwoot
      CHATWOOT_HUB_URL: https://hub.chatwoot.com
      # Alternativa para deshabilitar telemetría (recomendado):
      # DISABLE_TELEMETRY: "true"
      # ========================================================================

    ports:
      - "3000:3000"
    volumes:
      - ./v19/chatwoot_storage:/app/storage
      - ./v19/chatwoot_logs:/app/log
      - ./v19/chatwoot_tmp:/app/tmp
    networks:
      - odoo_network_19
    command: >
      sh -c "
        rm -f /app/tmp/pids/server.pid 2>/dev/null &&
        until pg_isready -h chatwoot-postgres -p 5432 -U chatwoot -d chatwoot_production 2>/dev/null; do
          echo 'Esperando PostgreSQL...' && sleep 5;
        done &&
        until nc -z redis 6379; do
          echo 'Esperando Redis...' && sleep 2;
        done &&
        bundle exec rails db:prepare &&
        bundle exec rails server -p 3000 -b 0.0.0.0
      "

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    depends_on:
      - chatwoot-postgres
    environment:
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      
      RAILS_HOST: https://chatwoot.unisasalud.com
      FRONTEND_URL: https://chatwoot.unisasalud.com
      ASSET_HOST: https://chatwoot.unisasalud.com
      ACTIVE_STORAGE_HOST: https://chatwoot.unisasalud.com
      
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot123
      POSTGRES_DB: chatwoot_production
      POSTGRES_HOST: chatwoot-postgres
      DATABASE_URL: postgresql://chatwoot:chatwoot123@chatwoot-postgres:5432/chatwoot_production
      
      REDIS_PASSWORD: redis123
      REDIS_URL: redis://:redis123@redis:6379
      
      SECRET_KEY_BASE: 99f4fa1f8fadd2125a12148ccf962c5d1ae16592a7da11ef9fc795f6a5c68e97737746c53ce0ecbc45d64235e349b879312d0a28431c81c2a59165d2d7077c54
      RAILS_MASTER_KEY: 99f4fa1f8fadd2125a12148ccf962c5d1ae16592a7da11ef9fc795f6a5c68e97737746c53ce0ecbc45d64235e349b879312d0a28431c81c2a59165d2d7077c54
      
      ACTIVE_STORAGE_SERVICE: local
      FILE_ATTACHMENT_ENABLED: "true"

      # Misma configuración SMTP que en app
      SMTP_ADDRESS: mail.privateemail.com
      SMTP_PORT: 465
      SMTP_USERNAME: admin@unisasalud.com
      SMTP_PASSWORD: 'Steamashit..17'
      SMTP_DOMAIN: unisasalud.com
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "false"
      SMTP_SSL: "true"
      SMTP_TLS: "true"
      MAILER_SENDER_EMAIL: admin@unisasalud.com
      MAIL_DOMAIN: unisasalud.com

      ACTION_MAILER_DELIVERY_METHOD: smtp
      ACTION_MAILER_SMTP_ADDRESS: mail.privateemail.com
      ACTION_MAILER_SMTP_PORT: 465
      ACTION_MAILER_SMTP_USER_NAME: admin@unisasalud.com
      ACTION_MAILER_SMTP_PASSWORD: 'Steamashit..17'
      ACTION_MAILER_SMTP_AUTHENTICATION: plain
      ACTION_MAILER_SMTP_SSL: "true"
      ACTION_MAILER_SMTP_ENABLE_STARTTLS_AUTO: "false"

      # ========== MODIFICACIÓN AGREGADA (siguiendo paso de Portainer) ==========
      # Descomentar o añadir la siguiente línea para conectar con el hub de Chatwoot
      CHATWOOT_HUB_URL: https://hub.chatwoot.com
      # Alternativa para deshabilitar telemetría (recomendado):
      # DISABLE_TELEMETRY: "true"
      # ========================================================================

    volumes:
      - ./v19/chatwoot_storage:/app/storage
      - ./v19/chatwoot_logs:/app/log
      - ./v19/chatwoot_tmp:/app/tmp
    networks:
      - odoo_network_19
    command: >
      sh -c "
        until nc -z redis 6379; do
          echo 'Esperando Redis...' && sleep 2;
        done &&
        bundle exec sidekiq -C config/sidekiq.yml
      "

networks:
  odoo_network_19:
    external: true
    name: odoo_network_19