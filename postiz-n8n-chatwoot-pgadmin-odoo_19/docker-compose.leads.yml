services:
  db-leads:
    image: pgvector/pgvector:pg15
    container_name: "odoo-db19-leads"
    environment:
      POSTGRES_DB: dbodoo19
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - odoo_network_19
    volumes:
      - "./v19-leads/pgdata/data:/var/lib/postgresql/data/pgdata"
      - "./v19-leads/pgdata/init:/docker-entrypoint-initdb.d"
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d dbodoo19"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  web-leads:
    image: "odoo-pers:19"
    container_name: "odoo-19-web-leads"
    user: "1001:1001"
    depends_on:
      db-leads:
        condition: service_healthy
    networks:
      - odoo_network_19
    ports:
      - "28069:8069"
      - "28072:8072"
    volumes:
      - "./v19-leads/odoo-web-data:/var/lib/odoo"
      - "./v19-leads/config:/etc/odoo"
      - "/home/simon/opt/odoo/modulos_odoo/shared/extra/19.0:/opt/odoo/custom-addons/extra"
      - "/home/simon/opt/odoo/modulos_odoo/shared/oca/19.0:/opt/odoo/custom-addons/oca"
      - "./v19-leads/logs:/var/log/odoo"
    environment:
      DB_HOST: db-leads
      USER: odoo
      DB_NAME: dbodoo19
      POSTGRES_USER: odoo
    secrets:
      - postgres_password
    stop_grace_period: 60s

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  odoo_network_19:
    external: true
    name: odoo_network_19
